   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2557a7" x="43.2" y="37.021563" transform="rotate(-0 43.2 37.021563)">INGENIERO/A 3  /  ENTRADAS Y SALIDAS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19283f" x="43.2" y="76.772813" transform="rotate(-0 43.2 76.772813)">Cómo entra, se valida y sale cada registro</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52637a" x="43.2" y="98.95125" transform="rotate(-0 43.2 98.95125)">Los conteos corresponden a la ejecución que generó estos diagramas.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2557a7" x="63.36" y="167.605313" transform="rotate(-0 63.36 167.605313)">ENTRADA  ·  ARCHIVOS PREPARADOS POR INGENIERÍA 1</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 198.196406)">transacciones_atm_fase2.csv  +  transferencias_digitales_fase2.json</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 217.956406)">catalogo_cuentas_fase2.csv  →  conjunto de cuentas válidas</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 238.125703)">Estas entradas se leen de data/interim/.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19283f" x="63.36" y="337.525312" transform="rotate(-0 63.36 337.525312)">INTEGRACIÓN REUTILIZADA  ·  FASES 3 Y 4</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 365.677187)">Fechas ISO, USD → MXN a 19.50, capping IQR y marca de cuenta huérfana.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 384.917187)">Sale un DataFrame integrado con 1,200 filas; conserva evidencia de calidad.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2557a7" x="63.36" y="488.725312" transform="rotate(-0 63.36 488.725312)">FASE 5  ·  TRANSFORMACIÓN</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 517.156406)">Entra: monto_mxn_capped, en pesos.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 536.656406)">Se agregan: monto_minmax ∈ [0, 1] y nivel_monto ∈ {Bajo, Medio, Alto}.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 556.337188)">Salida: el mismo DataFrame con columnas derivadas; los corruptos siguen disponibles para rechazo.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19283f" x="63.36" y="652.516406" transform="rotate(-0 63.36 652.516406)">FASE 6  ·  segregar_registros(df, cuentas_validas)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 683.476406)">Por cada fila: dict → TransaccionLimpia.model_validate(datos, context=...).</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 703.417187)">Contexto: cuentas del catálogo e identificadores ya aceptados.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 722.917187)">Validación: tipos estrictos, fecha, CLABE, correo, importes y coherencia de negocio.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 742.417187)">try: devuelve un modelo válido   /   except ValidationError: conserva las causas y el registro.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15734c" x="324" y="801.905625" transform="rotate(-0 324 801.905625)">VALIDACIÓN CORRECTA</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #ad3442" x="756" y="800.979844" transform="rotate(-0 756 800.979844)">VALIDATIONERROR CAPTURADO</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15734c" x="63.36" y="865.847812" transform="rotate(-0 63.36 865.847812)">1,072 REGISTROS VÁLIDOS</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 894.31125)">list[TransaccionLimpia]</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 912.31125)">Contiene los campos validados, las variables</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 930.144375)">transformadas y datos_origen_json.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 945)"/>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 966.31125)">Ejemplo aceptable de CLABE SPEI:</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 984.55125)">012210100614023846 (texto, 18 dígitos).</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad3442" x="588.96" y="865.331719" transform="rotate(-0 588.96 865.331719)">128 REGISTROS RECHAZADOS</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 894.31125)">list[RegistroCuarentena]</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 913.101562)">Guarda número de fila, identificador, motivo,</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 930.31125)">errores estructurados y registro recibido.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 945)"/>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 966.31125)">Ejemplo: CLABE '12345' → motivo de rechazo.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(588.96 984.55125)">El procesamiento continúa con la siguiente fila.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2557a7" x="63.36" y="1099.636406" transform="rotate(-0 63.36 1099.636406)">FASE 7  ·  SQLite: cargar_base_datos(limpios, cuarentena, ruta_bd)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1132.217187)">BEGIN IMMEDIATE → INSERT parametrizados en las DOS tablas:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1151.536406)">   transacciones_limpias                       cuarentena_errores</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1171.217187)">Todo correcto → commit(): ambas tablas quedan persistidas.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1190.717187)">Error SQL → rollback(): se revierte el lote completo, incluidos los DELETE de reemplazo.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1210.036406)">Archivo predeterminado: data/proyecto_final.sqlite3</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19283f" x="63.36" y="1336.165313" transform="rotate(-0 63.36 1336.165313)">ARCHIVOS DE SALIDA  ·  DESPUÉS DEL COMMIT</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1364.304375)">reportes/ing3/: fase5_transformadas.csv, transacciones_limpias.csv y cuarentena_errores.csv</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1382.544375)">resumen_ing3.json: conteos, parámetros Min-Max/cuantiles e integridad de SQLite.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #19283f" transform="translate(63.36 1400.47125)">diagramas/: pipeline por fases, UML, flujo de datos y visor con los conteos de este lote.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2557a7" x="540" y="1474.937187" transform="rotate(-0 540 1474.937187)">BALANCE DEL LOTE: 1,200 entradas = 1,072 limpias + 128 en cuarentena</text>
   </g>
  </g>
 </g>
